name: currency-hedge-llm-ci

on:
  pull_request:
    paths:
      - "currency-hedge-llm/**"
      - ".github/workflows/currency-hedge-llm-ci.yml"
  push:
    branches:
      - main
    paths:
      - "currency-hedge-llm/**"
      - ".github/workflows/currency-hedge-llm-ci.yml"

permissions:
  contents: read

jobs:
  test-demo-readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: currency-hedge-llm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Run full no-LLM workflow
        run: bash scripts/run_demo.sh

      - name: Enforce deployment readiness
        run: python -m currency_hedge_llm.cli deployment-readiness --config config/config.example.yaml --threshold 95
