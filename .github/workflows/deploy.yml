name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint frontend
        run: npm run lint

      - name: Validate trade framework
        run: npm run check:trade

      - name: Score dashboard quality
        run: npm run quality:dashboard

      - name: Include brand board in static output
        run: mkdir -p public/brand && cp -r brand/logo public/brand/logo

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Smoke test GitHub Pages artifact
        run: node scripts/smoke-pages-build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
