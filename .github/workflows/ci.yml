name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run check:trade
      - run: npm run check:collars
      - run: npm run check:pwa
      - run: npm run check:a11y
      - run: npm run quality:dashboard
      - run: npm run build
      - run: npm run build:pages
      - run: node scripts/smoke-pages-build.mjs
      - run: npm run check:budget
      - run: npm run check:production

  site-quality:
    name: Playwright and Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:lighthouse

  currency-hedge-llm:
    name: Currency hedge package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: currency-hedge-llm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest

      - name: Validate demo deployment config
        run: python -m currency_hedge_llm.cli doctor --config config/config.example.yaml --create-output-dirs

      - name: Build Python package
        run: python -m build

      - name: Run deterministic demo smoke test
        run: bash scripts/run_demo.sh
