name: hodge-research

on:
  pull_request:
    paths:
      - "hodge-research/**"
      - ".github/workflows/hodge-research.yml"
  push:
    branches:
      - main
    paths:
      - "hodge-research/**"
      - ".github/workflows/hodge-research.yml"

permissions:
  contents: read

jobs:
  verify-iteration-595:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hodge-research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install exact-arithmetic dependency
        run: python -m pip install sympy
      - name: Run independent verifiers
        run: python research/scripts/verify_595.py
