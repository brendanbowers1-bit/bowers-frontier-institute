[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "https://bowersfrontier.com/*"
  to = "https://www.bowersfrontier.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/credit-collars"
  to = "/.netlify/functions/credit-collars"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
