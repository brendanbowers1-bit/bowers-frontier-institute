[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/api/credit-collars"
  to = "/.netlify/functions/credit-collars"
  status = 200

[[redirects]]
  from = "/api/gnf-rates"
  to = "/.netlify/functions/gnf-rates"
  status = 200

[[redirects]]
  from = "/api/lrd-rates"
  to = "/.netlify/functions/lrd-rates"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
